version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/gha
    groups:
      github-actions:
        patterns: ["*"]

  # requirements-dev.txt is generated from pyproject.toml: review the lock against the process in AGENTS.md.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/pip
    groups:
      python:
        patterns: ["*"]

  # Images pinned by the capture stack. The Splunk image pinned in tests/splunk.sh is not a compose file or a
  # Dockerfile, so Dependabot cannot see it: bump it by hand.
  - package-ecosystem: docker-compose
    directory: /tests/capture
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/docker
    groups:
      docker:
        patterns: ["*"]
