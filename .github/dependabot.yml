version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/gha
    groups:
      github-actions:
        patterns: ["*"]

  # Weekly version updates scan pyproject.toml only; maintainers regenerate the hash lock with uv (see AGENTS.md).
  # The pip updater treats uv's compiled pins as independent requirements and can break AppInspect's constraints.
  # Security updates can bypass exclude-paths; validate and regenerate their locks before merging too.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements-dev.txt
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/pip
    groups:
      python:
        patterns: ["*"]

  # Images pinned by the capture stack. The Splunk image pinned in tests/splunk.sh is not a compose file or a
  # Dockerfile, so Dependabot cannot see it: bump it by hand.
  - package-ecosystem: docker-compose
    directory: /tests/capture
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    target-branch: main
    commit-message:
      prefix: deps/docker
    groups:
      docker:
        patterns: ["*"]
