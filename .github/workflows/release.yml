name: Release

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # tests.yml runs the Plumber gate, pre-commit, AppInspect and the live Splunk test, and builds the package once
  # (artifact ta-package). A second direct Plumber call would upload a duplicate plumber-report artifact.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require the live Splunk test
        env:
          RUN_SPLUNK_TESTS: ${{ vars.RUN_SPLUNK_TESTS }}
        run: |
          if [ "$RUN_SPLUNK_TESTS" != "true" ]; then
            echo "::error::A release needs the live Splunk test: set the repository variable RUN_SPLUNK_TESTS to true (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version, tag and changelog
        id: version
        run: python3 -I .github/scripts/release_check.py "$GITHUB_REF_NAME" --notes release-notes.md >> "$GITHUB_OUTPUT"
      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ta-package
          path: release
      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/TA-bunkerweb-${VERSION}.tgz"
          test "$(find release -type f | wc -l)" -eq 1
          mkdir sbom-input
          tar -xzf "release/TA-bunkerweb-${VERSION}.tgz" -C sbom-input
          cat >> release-notes.md <<EOF
          ### Installation

          Download \`TA-bunkerweb-${VERSION}.tgz\`, check it against \`SHA256SUMS\` and install it as described in the
          [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md).
          EOF
      - name: Generate the SBOM
        env:
          TRIVY_VERSION: "0.70.0"
          # SHA-256 of trivy_0.70.0_Linux-64bit.tar.gz, from the release's checksums file.
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          trivy_dir="$(mktemp -d)"
          curl -fsSL -o "${trivy_dir}/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${trivy_dir}/trivy.tar.gz" | sha256sum --check -
          tar -xzf "${trivy_dir}/trivy.tar.gz" -C "$trivy_dir" trivy
          "${trivy_dir}/trivy" fs --scanners vuln,secret --format cyclonedx --output "release/TA-bunkerweb-${VERSION}.cdx.json" sbom-input
      - name: Write SHA256SUMS
        run: (cd release && sha256sum -- *.tgz *.cdx.json > SHA256SUMS)
      - name: Attest the package and the SBOM
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.cdx.json
      - name: Export signed provenance
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" release/provenance.sigstore.json
          jq -ce '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json" and (.signatures | length > 0))' "$BUNDLE_PATH" > release/provenance.intoto.jsonl
          cp -- release-notes.md release/release-notes.md
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  # Required reviewers on the release environment approve the attested build. Every publication job descends from here.
  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recheck release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" |
            jq -e '.name == "release" and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0 and all(.reviewers[]; .type == "User" and (.reviewer.login | IN("TheophileDiot", "fl0ppy-d1sk"))))' >/dev/null
      - name: Recheck signed tag target before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(printf '%s' "$TAG_REF" | jq -r '.object.type')" = tag
          OBJ_SHA="$(printf '%s' "$TAG_REF" | jq -r '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" |
            jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' >/dev/null

  release:
    needs: [build, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Check asset hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Upload draft GitHub Release
        id: github_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.version }}
          body_path: release/release-notes.md
          files: |
            release/*.tgz
            release/*.cdx.json
            release/SHA256SUMS
            release/provenance.intoto.jsonl
            release/provenance.sigstore.json
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq .draft | grep -Fx false
