# BunkerWeb Add-on for Splunk. Search-time extractions only: the Universal Forwarder
# needs no props.conf. Install this app on the search head and on the indexers (or on the
# heavy forwarder that parses). CIM targeted: 6.x (Web, Intrusion Detection).

##############################################################################
# bunkerweb:access - the key=value access log (LOG_FORMAT_n from the README)
##############################################################################
[bunkerweb:access]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TIME_PREFIX = ^time=
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 20000
KV_MODE = none
category = Web
description = BunkerWeb access log in the documented key=value format

# Parse the documented format as one record: field-like text in quoted values is untrusted.
# nginx escapes embedded quotes as \x22. Keep the full plugin id, including "bad behavior".
# host is Splunk's sending machine; the logged virtual host goes to site instead.
EXTRACT-bw_access = \Atime=(?<time>\S+) host=(?<site>[^\s"]+) client=(?<client>\S+) request_id=(?<request_id>\S+) method=(?<method>\S+) uri="(?<uri>[^"]*)" status=(?<status>\d{3}) bytes=(?<bytes>\d+) ua="(?<ua>[^"]*)" reason=(?<bw_reason>[^\s=][^=]*?)? modsec_rules="(?:-|\s*(?<bw_modsec_rules>\d[^"]*?)\s*)" modsec_score=(?<modsec_score>\S+) modsec_id=(?:-|(?<bw_modsec_id>[^\s"]+))\z
# Runs after bw_access (ASCII order), against only its extracted URI.
EXTRACT-bw_uri = ^(?<uri_path>[^?"]*)(?:\?(?<uri_query>[^"]*))?$ in uri

# Drop "-" placeholders and keep one value per rule id.
EVAL-reason = bw_reason
EVAL-modsec_rules = if(isnull(bw_modsec_rules), null(), mvdedup(split(replace(bw_modsec_rules, "\s+", " "), " ")))
EVAL-modsec_score = if(modsec_score="-", null(), modsec_score)
EVAL-modsec_id = bw_modsec_id

# CIM Web
FIELDALIAS-bw_access_src = client AS src
FIELDALIAS-bw_access_dest = site AS dest
FIELDALIAS-bw_access_method = method AS http_method
FIELDALIAS-bw_access_ua = ua AS http_user_agent
FIELDALIAS-bw_access_bytes = bytes AS bytes_out
EVAL-vendor = "Bunkerity"
EVAL-product = "BunkerWeb"
EVAL-vendor_product = "BunkerWeb"
# blocked = BunkerWeb answered with an error because a plugin (reason) or ModSecurity denied the request
EVAL-action = if(tonumber(status)>=400 AND (isnotnull(bw_modsec_id) OR isnotnull(bw_reason)), "blocked", "allowed")

# CIM Intrusion Detection (events tagged ids attack, see eventtypes.conf)
EVAL-signature = if(isnotnull(bw_modsec_id), coalesce(if(isnotnull(bw_modsec_rules), mvdedup(split(replace(bw_modsec_rules, "\s+", " "), " ")), null()), "ModSecurity"), bw_reason)
EVAL-signature_id = if(isnotnull(bw_modsec_id) AND isnotnull(bw_modsec_rules), mvdedup(split(replace(bw_modsec_rules, "\s+", " "), " ")), null())
EVAL-category = if(isnotnull(bw_modsec_id), "ModSecurity", if(isnotnull(bw_reason), "BunkerWeb plugin", null()))
EVAL-ids_type = if(isnotnull(bw_modsec_id) OR isnotnull(bw_reason), "application", null())

##############################################################################
# bunkerweb:error - nginx error log: BunkerWeb [ACCESS] lines, bans, ModSecurity
##############################################################################
[bunkerweb:error]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TIME_PREFIX = ^
TIME_FORMAT = %Y/%m/%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
# ModSecurity warning lines carry the matched data and run to several KB.
TRUNCATE = 100000
KV_MODE = none
description = BunkerWeb (nginx) error log

# Extract the message before nginx's request context; error-log quotes are not escaped.
# Runs first (ASCII order), so the dependent extractions never scan request/host/referrer text.
EXTRACT-bw_0error_head = \A\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2}:\d{2}\s+\[(?<log_level>\w+)\]\s+(?<pid>\d+)#(?<tid>\d+):\s+(?:\*(?<connection>\d+)\s+)?(?<bw_error_message>(?:\[(?<bw_component>[A-Za-z_]+)\]\s+)?(?:(?!,\s+client:).)*)(?:,\s+client:|\z)
EXTRACT-bw_error_tail = ,\s+client:\s+(?<src>[^,\s]+),\s+server:\s+(?<dest>[^,\s]+)(?:,\s+request:\s+"(?<http_method>[A-Z]+)\s+(?<uri_path>[^?\s]*)(?:\?(?<uri_query>\S*))?\s+HTTP/[\d.]+")?(?:,\s+(?:upstream:\s+"[^"]*",\s+)?host:\s+"(?<http_host>[^"]*)")?
# [ACCESS] denied access from limit : <message>
EXTRACT-bw_denied = \A\[ACCESS\]\s+denied access from\s+(?<bw_plugin>[^:\r\n]+?)\s+:\s+(?<bw_message>.*)\z in bw_error_message
# [ACCESS] IP <ip> is banned with reason bad behavior (3595.5s remaining)
EXTRACT-bw_ban = \A\[ACCESS\]\s+(?:detected\s+)?IP\s+(?<bw_ban_ip>\S+)\s+(?:ban with reason|is banned with reason)\s+(?<bw_ban_reason>.+?)\s+\((?<bw_ban_ttl>[\d.]+)s remaining\)\z in bw_error_message
EXTRACT-bw_modsec_verdict = \A(?:\[client [^\]\s]+\]\s+)?ModSecurity:\s+(?<modsec_verdict>Access denied|Warning)\b in bw_error_message
EXTRACT-bw_modsec_code = \A(?:\[client [^\]\s]+\]\s+)?ModSecurity: Access denied with code (?<modsec_http_code>\d+) \(phase (?<modsec_phase>\d+)\)\. in bw_error_message
# ModSecurity 3 emits this ordered block. Never search individual tokens inside match/data/uri values.
# Validate the entire raw envelope: decoded URI text can forge a client delimiter.
# Fail closed on missing fields, duplicate blocks or unescaped quotes in metadata/request context.
EXTRACT-bw_modsec_details = \A\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2}:\d{2}\s+\[\w+\]\s+\d+#\d+:\s+(?:\*\d+\s+)?(?:\[client [^\]\s]+\]\s+)?ModSecurity: (?:Access denied with code \d+ \(phase \d+\)|Warning)\. (?:(?! \[file ").)* \[file "[^"]*"\] \[line "\d+"\] \[id "(?<modsec_rule_id>\d+)"\] \[rev "[^"]*"\] \[msg "(?<modsec_msg>[^"]*)"\] \[data "[^"]*"\] \[severity "(?<modsec_severity>\d)"\] \[ver "(?<crs_version>[^"]*)"\] \[maturity "\d+"\] \[accuracy "\d+"\](?: \[tag "[^"]*"\])* \[hostname "[^"]*"\] \[uri "[^"]*"\] \[unique_id "(?<modsec_id>[^"]+)"\] \[ref "[^"]*"\](?:,\s+client:\s+[^,"\s]+,\s+server:\s+[^,"\s]*(?:,\s+request:\s+"[^"]*")?(?:,\s+subrequest:\s+"[^"]*")?(?:,\s+upstream:\s+"[^"]*")?(?:,\s+host:\s+"[^"]*")?(?:,\s+referrer:\s+"[^"]*")?)?\z
EVAL-vendor_product = "BunkerWeb"

##############################################################################
# bunkerweb:modsec_audit - ModSecurity audit log, one JSON object per line
##############################################################################
[bunkerweb:modsec_audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TIME_PREFIX = "time_stamp":"
TIME_FORMAT = %a %b %e %H:%M:%S %Y
MAX_TIMESTAMP_LOOKAHEAD = 40
# Request and response headers (parts B and F) make entries of 7 to 20 KB; with part C
# (request bodies) they can be larger.
TRUNCATE = 100000
KV_MODE = json
description = ModSecurity JSON audit log (SecAuditLogFormat JSON)

# CIM Intrusion Detection
FIELDALIAS-bw_audit_src = "transaction.client_ip" AS src
FIELDALIAS-bw_audit_src_port = "transaction.client_port" AS src_port
FIELDALIAS-bw_audit_dest = "transaction.request.hostname" AS dest
FIELDALIAS-bw_audit_dest_ip = "transaction.host_ip" AS dest_ip
FIELDALIAS-bw_audit_dest_port = "transaction.host_port" AS dest_port
FIELDALIAS-bw_audit_method = "transaction.request.method" AS http_method
FIELDALIAS-bw_audit_status = "transaction.response.http_code" AS status
FIELDALIAS-bw_audit_ua = "transaction.request.headers.User-Agent" AS http_user_agent
FIELDALIAS-bw_audit_id = "transaction.unique_id" AS modsec_id
FIELDALIAS-bw_audit_sig_id = "transaction.messages{}.details.ruleId" AS signature_id
FIELDALIAS-bw_audit_sig = "transaction.messages{}.message" AS signature
EVAL-uri_path = replace('transaction.request.uri', "\?.*$", "")
EVAL-uri_query = if(match('transaction.request.uri', "\?"), replace('transaction.request.uri', "^[^?]*\?", ""), null())
EVAL-action = if(lower('transaction.is_interrupted')="true", "blocked", "allowed")
# Attack categories from the CRS tags (attack-xss, attack-sqli, ...); the anomaly rule tag is left out.
EVAL-category = mvdedup(mvfilter(match('transaction.messages{}.details.tags{}', "^attack-")))
# CRS severity 0 and 1 (emergency, alert) critical, 2 high, 3 medium, 4 low, 5 and above informational.
# The most severe match wins. Entries containing blocking rule 949110 (severity 0) are critical.
EVAL-severity = case(isnull('transaction.messages{}.details.severity'), null(), tonumber(mvindex(mvsort('transaction.messages{}.details.severity'), 0))<=1, "critical", tonumber(mvindex(mvsort('transaction.messages{}.details.severity'), 0))=2, "high", tonumber(mvindex(mvsort('transaction.messages{}.details.severity'), 0))=3, "medium", tonumber(mvindex(mvsort('transaction.messages{}.details.severity'), 0))=4, "low", true(), "informational")
EVAL-ids_type = "application"
EVAL-vendor = "Bunkerity"
EVAL-product = "BunkerWeb"
EVAL-vendor_product = "BunkerWeb"
