[bunkerweb_access]
search = sourcetype=bunkerweb:access
description = BunkerWeb access log events (CIM Web)

[bunkerweb_access_blocked]
search = sourcetype=bunkerweb:access action=blocked
description = Requests BunkerWeb denied, by a plugin (reason) or by ModSecurity (CIM Intrusion Detection)

[bunkerweb_modsec_audit]
search = sourcetype=bunkerweb:modsec_audit
description = ModSecurity audit log entries (CIM Intrusion Detection)

[bunkerweb_error]
search = sourcetype=bunkerweb:error
description = BunkerWeb error log events
